<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Drive-in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Cinema Drive-in</h1>
      <p>Suba o vídeo, copie o link, passe no script de TV. Sem cookies.</p>
    </header>

    <div id="drop-zone">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p><strong>Clique ou arraste</strong> um vídeo aqui</p>
      <p>Qualquer formato · Expira em 24h</p>
    </div>
    <input type="file" id="file-input" accept="video/*">

    <div id="progress-container">
      <div id="progress-bar-wrap">
        <div id="progress-bar"></div>
      </div>
      <p id="progress-label">0%</p>
    </div>

    <div id="player-section">
      <video id="player" controls></video>
      <div id="player-info">
        <span id="player-title"></span>
        <span id="player-url"></span>
      </div>
    </div>

    <div id="library">
      <h2>Na Biblioteca</h2>
      <ul id="video-list"></ul>
    </div>
  </div>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
